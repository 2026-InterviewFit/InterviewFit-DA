services:
  fastapi:
    build: .
    container_name: interviewfit-fastapi
    ports:
      - "8000:8000"
    env_file:
      - .env.prod
    depends_on:
      - tei
    networks:
      - interview-network

  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    container_name: interviewfit-tei
    ports:
      - "80:80"
    command:
      - "--model-id"
      - "${EMBEDDING_MODEL_ID:-intfloat/multilingual-e5-small}"
    volumes:
      - tei_cache:/data/huggingface
    networks:
      interview-network:
        aliases:
          - tei

volumes:
  tei_cache:

networks:
  interview-network:
    external: true
    name: interview-network